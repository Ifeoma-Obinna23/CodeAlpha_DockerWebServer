# CodeAlpha DevOps Internship - Task 1: CI/CD Pipeline using Azure
#
# What this does, in plain terms:
#   1. Build stage  - builds the Docker image from the Dockerfile in
#      CodeAlpha_DockerWebServer, tags it with the build number, and
#      pushes it to Azure Container Registry (ACR).
#   2. Deploy stage - tells the App Service to pull that exact new image
#      and restart with it.
#
# Runs automatically whenever code is pushed to the "main" branch.

trigger:
  - main

variables:
  # --- EDIT THESE FOUR VALUES to match your own resources ---
  acrName: 'ifyazurecr'                        # your ACR name, no ".azurecr.io"
  imageName: 'codealpha-webserver'              # name for the image inside ACR
  webAppName: 'ifyazurewebsite'                 # your App Service name
  resourceGroup: 'Azure_Pipeline'               # your resource group name

  # These build the full registry login server and image tag from the
  # variables above - no need to edit below this line.
  acrLoginServer: '$(acrName).azurecr.io'
  imageTag: '$(Build.BuildId)'

stages:

  # ---------------------------------------------------------------------
  # STAGE 1: Build the Docker image and push it to Azure Container Registry
  # ---------------------------------------------------------------------
  - stage: Build
    displayName: 'Build and push Docker image'
    jobs:
      - job: BuildAndPush
        displayName: 'Build and push'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build and push image to ACR'
            inputs:
              containerRegistry: 'ACR-ServiceConnection'   # must match the name of your Docker Registry service connection
              repository: '$(imageName)'
              command: 'buildAndPush'
              Dockerfile: '**/Dockerfile'
              tags: |
                $(imageTag)
                latest

  # ---------------------------------------------------------------------
  # STAGE 2: Deploy the newly built image to the Azure App Service
  # ---------------------------------------------------------------------
  - stage: Deploy
    displayName: 'Deploy to Azure App Service'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployWebApp
        displayName: 'Deploy web app'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy container to App Service'
                  inputs:
                    azureSubscription: 'Azure-ServiceConnection'   # must match the name of your Azure Resource Manager service connection
                    appName: '$(webAppName)'
                    containers: '$(acrLoginServer)/$(imageName):$(imageTag)'
